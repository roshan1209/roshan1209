<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ShopEasy Order Summary - Settings</title>
    <style>
      body { font-family: Inter, system-ui, Arial, sans-serif; padding: 16px; }
      .field { margin-bottom: 16px; }
      label { display: block; font-weight: 600; margin-bottom: 6px; }
      input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; }
      small { color: #666; }
    </style>
  </head>
  <body>
    <div class="field">
      <label for="orders_api_base_url">Orders API Base URL</label>
      <input id="orders_api_base_url" type="text" />
      <small>Example: https://api.mockorders.local</small>
    </div>
    <div class="field">
      <label for="orders_api_token">Orders API Token</label>
      <input id="orders_api_token" type="password" />
    </div>
    <div class="field">
      <label for="orders_to_show">Number of recent orders to display</label>
      <input id="orders_to_show" type="number" min="1" max="20" />
    </div>
    <script>
      function getConfigs(configs) {
        document.getElementById('orders_api_base_url').value = configs.orders_api_base_url || '';
        document.getElementById('orders_api_token').value = configs.orders_api_token || '';
        document.getElementById('orders_to_show').value = configs.orders_to_show || 5;
      }
      function postConfigs() {
        return {
          orders_api_base_url: document.getElementById('orders_api_base_url').value.trim(),
          orders_api_token: document.getElementById('orders_api_token').value.trim(),
          orders_to_show: Number(document.getElementById('orders_to_show').value || 5)
        }
      }
    </script>
  </body>
</html>
